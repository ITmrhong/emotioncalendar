name: iOS Simulator Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: >
          dotnet restore EmotionCalendarDiary.csproj
          -p:TargetFramework=net8.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build for iOS Simulator (arm64)
        run: >
          dotnet build EmotionCalendarDiary.csproj
          -p:TargetFramework=net8.0-ios
          -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:BuildIpa=false
          -p:CodesignKey=
          --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: bin/Debug/net8.0-ios/iossimulator-arm64/*.app

      - name: Boot simulator and install app
        run: |
          BUNDLE_ID="com.companyname.emotioncalendardiary"
          APP_PATH=$(find bin/Debug/net8.0-ios/iossimulator-arm64 -maxdepth 1 -name "*.app" | head -n 1)
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name']:
                          print(d['udid']); sys.exit(0)
          ")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshot.png
